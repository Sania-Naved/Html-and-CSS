<!DOCTYPE html>
<html lang="en">
<head>
    <!--Meta Tags and Favicon -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Tech Club Registration">
    <meta name="author" content="Tech Club">
    <title>Register - Tech Club</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
</head>
<body>

    <!-- Navigation Menu -->
    <nav>
        <a href="index.html">Home</a> |
        <a href="about.html">About</a> |
        <a href="register.html">Register</a> |
        <a href="contact.html">Contact</a>
    </nav>
    <hr>

    <h1>Tech Club Registration</h1>

    <!--Events Table (thead, tbody, tfoot) -->
    <h2>Club Events</h2>
    <table border="1" cellpadding="8">
        <thead>
            <tr>
                <th>Event Name</th>
                <th>Date</th>
                <th>Venue</th>
                <th>Seats</th>
            </tr>
        </thead>
        <tbody>
            <tr>
                <td>Coding Hackathon</td>
                <td>15 Nov 2026</td>
                <td>Lab 1</td>
                <td>50</td>
            </tr>
            <tr>
                <td>Web Dev Workshop</td>
                <td>20 Nov 2026</td>
                <td>Lab 2</td>
                <td>40</td>
            </tr>
            <tr>
                <td>Robotics Expo</td>
                <td>25 Nov 2026</td>
                <td>Seminar Hall</td>
                <td>60</td>
            </tr>
        </tbody>
        <tfoot>
            <tr>
                <td colspan="3"><b>Total Seats</b></td>
                <td><b>150</b></td>
            </tr>
        </tfoot>
    </table>

    <br><hr>

    <!--Registration Form -->
    <h2>Register Here</h2>
    <form action="#" method="post">

        <!-- Name, Email, Password with Label -->
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>

        <label for="email">Email:</label><br>
        <input type="email" id="email" name="email" required><br><br>

        <label for="password">Password:</label><br>
        <input type="password" id="password" name="password" required><br><br>

        <!-- Date and Phone -->
        <label for="dob">Date of Birth:</label><br>
        <input type="date" id="dob" name="dob" required><br><br>

        <label for="phone">Phone:</label><br>
        <input type="tel" id="phone" name="phone" required><br><br>

        <!--Radio Buttons -->
        <label>Year:</label><br>
        <input type="radio" id="y1" name="year" value="1st">
        <label for="y1">1st Year</label>
        <input type="radio" id="y2" name="year" value="2nd">
        <label for="y2">2nd Year</label>
        <input type="radio" id="y3" name="year" value="3rd">
        <label for="y3">3rd Year</label><br><br>

        <!--Dropdown (Select) -->
        <label for="event">Select Event:</label><br>
        <select id="event" name="event">
            <option value="hackathon">Coding Hackathon</option>
            <option value="webdev">Web Dev Workshop</option>
            <option value="robotics">Robotics Expo</option>
        </select><br><br>

        <!--Checkboxes -->
        <label>Interests:</label><br>
        <input type="checkbox" id="c1" name="interest" value="coding">
        <label for="c1">Coding</label>
        <input type="checkbox" id="c2" name="interest" value="design">
        <label for="c2">Design</label>
        <input type="checkbox" id="c3" name="interest" value="robotics">
        <label for="c3">Robotics</label><br><br>

        <!--Textarea (Message Box) -->
        <label for="message">Message:</label><br>
        <textarea id="message" name="message" rows="4" cols="30"></textarea><br><br>

        <!--Submit Button -->
        

    </form>

</body>
</html>
