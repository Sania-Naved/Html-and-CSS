<!DOCTYPE html>
<html lang="en">
<head>
    <Meta tags, Favicon aur Style -->
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech Club Register</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">

    <!--Google Font (Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">

</head>
<body>

    <!-- Navigation -->
    <nav>
        <a href="index.html">Home</a>
        <a href="about.html">About</a>
        <a href="register.html">Register</a>
        <a href="contact.html">Contact</a>
    </nav>

    <!-- #hero (ID) -->
    <div id="hero">
        <h1>Tech Club Event Portal</h1>
        <p>Register below for upcoming events and workshops.</p>
    </div>

    <!-- .card (Class) - Table -->
    <div class="card">
        <h2>Upcoming Events</h2>
        <table>
            <thead>
                <tr>
                    <th>Event</th>
                    <th>Date</th>
                    <th>Seats</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>Coding Contest</td>
                    <td>15 Nov 2026</td>
                    <td>50</td>
                </tr>
                <tr>
                    <td>Web Dev Workshop</td>
                    <td>20 Nov 2026</td>
                    <td>40</td>
                </tr>
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="2">Total Seats</td>
                    <td>90</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <!-- .card (Class) - Form -->
    <div class="card">
        <h2>Student Registration</h2>
        <form action="#" method="post">
            <label for="name">Name:</label><br>
            <input type="text" id="name" name="name" required><br><br>

            <label for="email">Email:</label><br>
            <input type="email" id="email" name="email" required><br><br>

            <label for="pass">Password:</label><br>
            <input type="password" id="pass" name="pass" required><br><br>

            <label for="dob">DOB:</label><br>
            <input type="date" id="dob" name="dob"><br><br>

            <label for="phone">Phone:</label><br>
            <input type="tel" id="phone" name="phone"><br><br>

            <label>Year:</label><br>
            <input type="radio" id="y1" name="year" value="1st"> <label for="y1">1st</label>
            <input type="radio" id="y2" name="year" value="2nd"> <label for="y2">2nd</label><br><br>

            <label for="event">Select Event:</label><br>
            <select id="event" name="event">
                <option value="coding">Coding Contest</option>
                <option value="web">Web Dev Workshop</option>
            </select><br><br>

            <label>Interest:</label><br>
            <input type="checkbox" id="c1" name="skill" value="coding"> <label for="c1">Coding</label>
            <input type="checkbox" id="c2" name="skill" value="iot"> <label for="c2">IoT</label><br><br>

            <label for="msg">Message:</label><br>
            <textarea id="msg" name="msg" rows="3"></textarea><br><br>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
